[defaults]
inventory = ansible/inventories/local/hosts.yml
roles_path = ansible/roles
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
bin_ansible_callbacks = True
localhost_warning = False
retry_files_enabled = False

[privilege_escalation]
# Ubuntu 26.04 points /usr/bin/sudo at sudo-rs (a Rust reimplementation).
# Ansible's sudo become plugin detects its password prompt with
#     any(line.strip().startswith(prompt) for line in output.splitlines())
# -- a PREFIX match on each stripped line. sudo-rs renders the prompt passed
# via -p as "[sudo: <prompt>] Password:" instead of emitting <prompt> at the
# start of the line, so the prefix match never succeeds, the password is never
# sent, and become fails with:
#     Timed out waiting for become success or become password prompt.
# There is no Ansible option to change the prompt string. The workstation
# group vars select the repository wrapper, which prefers classic sudo where
# available and falls back to /usr/bin/sudo on older Pop!_OS/Ubuntu releases.
# The system default is not changed. This generic config value is only a
# fallback; the wrapper path itself is supplied as an absolute host variable.
# Ansible's worker calls setsid() before running a task, so become has no
# controlling terminal and sudo's tty credential cache can never be reused;
# bootstrap.sh therefore passes --ask-become-pass, and the plugin drops its
# default -n flag before feeding the password to classic sudo's prompt.
#
# Upstream: https://github.com/ansible/ansible/issues/85837
#   Launchpad: https://bugs.launchpad.net/bugs/2122414
# As of 2026-10-29 no stable release fixes this: 2.20.10 and 2.21.5 still fail.
# The fix (check_password_prompt() also matches sudo-rs's localized
# "[sudo: <prompt>] Password:" line) shipped in the 2.20.11rc1, 2.21.6rc1 and
# 2.22.0rc2 release candidates published 2026-10-27; 2.20.11/2.21.6 finals are
# expected around 2026-11-03 (2.22.0 around 2026-11-10). Then raise the
# controller floor, and delete this [privilege_escalation] block, the wrapper
# scripts/ansible-become-sudo and ansible_become_exe in group_vars/all/main.yml.
# Keep --ask-become-pass in bootstrap.sh even after that: Ansible's worker calls
# setsid(), so become has no tty and sudo's timestamp cache can never be reused.
# Python floors: 2.20.11/2.21.6 need >=3.12, 2.22 needs >=3.13.
become_exe = sudo
