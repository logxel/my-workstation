[defaults]
inventory = ansible/inventories/local/hosts.yml
roles_path = ansible/roles
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
bin_ansible_callbacks = True
localhost_warning = False
retry_files_enabled = False

[privilege_escalation]
# Ubuntu 26.04 points /usr/bin/sudo at sudo-rs (a Rust reimplementation).
# Ansible's sudo become plugin detects its password prompt with
#     any(line.strip().startswith(prompt) for line in output.splitlines())
# -- a PREFIX match on each stripped line. sudo-rs renders the prompt passed
# via -p as "[sudo: <prompt>] Password:" instead of emitting <prompt> at the
# start of the line, so the prefix match never succeeds, the password is never
# sent, and become fails with:
#     Timed out waiting for become success or become password prompt.
# There is no Ansible option to change the prompt string, so point become at
# the classic sudo binary, which is still installed alongside sudo-rs on 26.04
# and prints the prompt verbatim. The system default stays sudo-rs; only
# Ansible's privileged escalation uses classic sudo. /usr/bin/sudo.ws is
# dpkg-owned by the 'sudo' package (1.9.17p2).
#
# Upstream: https://github.com/ansible/ansible/issues/85837
#   Launchpad: https://bugs.launchpad.net/bugs/2122414
# No RELEASED ansible-core fixes this (2.20.9 and 2.21.4 are both affected).
# The fix landed on devel only; the stable-2.18/2.19/2.20 backports were merged
# 2026-05-11 and reverted the same day because the hardcoded "Password:" literal
# breaks under localization. The proper i18n fix is ansible/ansible#86964,
# still a draft. WHEN a stable release ships a working fix, delete this
# [privilege_escalation] override -- it is a workaround, not a preference.
become_exe = /usr/bin/sudo.ws
