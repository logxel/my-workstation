---
- name: Query configured system Flatpak remotes
  ansible.builtin.command:
    cmd: flatpak remotes --system --columns=name
  changed_when: false
  register: flatpak_remotes
  when: common_flatpak_apps | length > 0
  tags:
    - flatpak

- name: Ensure Flathub is configured system-wide
  when:
    - common_flatpak_apps | length > 0
    - "'flathub' not in flatpak_remotes.stdout_lines"
  tags:
    - flatpak
  block:
    - name: Add the system Flathub remote
      ansible.builtin.command:
        cmd: flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      changed_when: false
  rescue:
    - name: Warn when Flathub remote setup fails
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not configure the system Flathub remote.
          Bootstrap will continue, but Flatpak app installation may fail later.
          Details: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg)
          | default('no error message provided') }}
      changed_when: false

- name: Check which Flatpak applications are already installed
  ansible.builtin.command:
    cmd: flatpak info --system {{ item }}
  loop: "{{ common_flatpak_apps }}"
  register: flatpak_install_checks
  changed_when: false
  failed_when: false
  when: common_flatpak_apps | length > 0
  tags:
    - flatpak

- name: Install missing Flatpak applications from Flathub # noqa: ignore-errors
  ansible.builtin.command:
    cmd: flatpak install --system --noninteractive flathub {{ item.item }}
  loop: "{{ flatpak_install_checks.results | default([]) }}"
  register: flatpak_install_results
  ignore_errors: true
  when:
    - common_flatpak_apps | length > 0
    - item.rc != 0
  changed_when: false
  tags:
    - flatpak

- name: Warn when Flatpak app installation fails for an individual application # noqa: ignore-errors
  ansible.builtin.fail:
    msg: >-
      WARNING: Could not install Flatpak application {{ item.item.item }} from Flathub.
      Bootstrap will continue with the remaining optional applications.
      Details: {{ item.stderr | default('no error message provided') }}
  ignore_errors: true
  loop: "{{ flatpak_install_results.results | default([]) }}"
  when:
    - item.failed | default(false)
  tags:
    - flatpak
