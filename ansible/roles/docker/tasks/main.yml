---
- name: Reject an unsupported Docker image store
  ansible.builtin.assert:
    that:
      - docker_image_store in ['overlay2', 'containerd']
    fail_msg: >-
      docker_image_store must be 'overlay2' (classic image store, the default) or
      'containerd' (containerd image store, reported as the overlayfs storage driver);
      got '{{ docker_image_store }}'.
  when: common_enable_docker | default(false)
  tags:
    - docker

- name: Check whether the user Docker config exists
  become: true
  become_user: "{{ local_user }}"
  ansible.builtin.stat:
    path: "{{ common_user_docker_config_path }}"
  register: docker_user_config_file
  when: common_enable_docker | default(false)
  tags:
    - docker

- name: Migrate Docker Desktop config.json for Docker Engine
  become: true
  become_user: "{{ local_user }}"
  when:
    - common_enable_docker | default(false)
    - common_has_docker_desktop
    - docker_desktop_cleanup_approved | bool
    - docker_user_config_file.stat.exists
  tags:
    - docker
  block:
    - name: Read the current user Docker config
      ansible.builtin.slurp:
        path: "{{ common_user_docker_config_path }}"
      register: docker_user_config_slurp

    - name: Parse the current user Docker config
      ansible.builtin.set_fact:
        docker_user_config_existing: "{{ docker_user_config_slurp.content | b64decode | from_json }}"

    - name: Remove Docker Desktop-only user config keys
      ansible.builtin.set_fact:
        docker_user_config_migrated: >-
          {{
            docker_user_config_existing
            | dict2items
            | rejectattr('key', 'in', ['credsStore', 'currentContext'])
            | items2dict
          }}

    - name: Backup the original Docker user config before migration
      ansible.builtin.copy:
        src: "{{ common_user_docker_config_path }}"
        dest: "{{ common_user_docker_config_path }}.docker-desktop.bak"
        remote_src: true
        mode: "0600"
        force: false
      when: docker_user_config_migrated != docker_user_config_existing

    - name: Write the migrated Docker user config
      ansible.builtin.copy:
        dest: "{{ common_user_docker_config_path }}"
        content: "{{ docker_user_config_migrated | to_nice_json }}"
        mode: "0600"
      when: docker_user_config_migrated != docker_user_config_existing
  rescue:
    - name: Stop when the user Docker config cannot be migrated safely
      ansible.builtin.fail:
        msg: >-
          {{ common_user_docker_config_path }} exists but could not be parsed as valid JSON, so Docker Desktop
          cleanup cannot continue safely. Fix or remove the file, or back it up manually before rerunning with
          docker_desktop_cleanup_approved=true.

- name: Remove the Docker Desktop user state directory after migration
  become: true
  become_user: "{{ local_user }}"
  ansible.builtin.file:
    path: "{{ common_user_docker_desktop_dir }}"
    state: absent
  when:
    - common_enable_docker | default(false)
    - common_has_docker_desktop
    - docker_desktop_cleanup_approved | bool
  tags:
    - docker

- name: Ensure the Docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"
  when: common_enable_docker | default(false)
  tags:
    - docker

- name: Check whether Docker daemon configuration exists
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: docker_daemon_file
  when: common_enable_docker | default(false)
  tags:
    - docker

- name: Load the current Docker daemon configuration
  when:
    - common_enable_docker | default(false)
    - docker_daemon_file.stat.exists
  tags:
    - docker

  block:
    - name: Read the current Docker daemon configuration
      ansible.builtin.slurp:
        path: /etc/docker/daemon.json
      register: docker_daemon_slurp

    - name: Parse the current Docker daemon configuration
      ansible.builtin.set_fact:
        docker_daemon_existing_config: "{{ docker_daemon_slurp.content | b64decode | from_json }}"
  rescue:
    - name: Ignore an unreadable or invalid Docker daemon configuration
      ansible.builtin.set_fact:
        docker_daemon_existing_config: {}

# Guards the requested image store before daemon.json is written: the daemon and
# driver checks, the space requirement and the old build-cache flush all happen
# here so a doomed migration fails before any half-migrated configuration lands.
- name: Guard the Docker image store before the daemon configuration is written
  ansible.builtin.import_tasks: image_store.yml
  vars:
    docker_image_store_phase: pre
  when: common_enable_docker | default(false)
  tags:
    - docker

- name: Compose the effective Docker daemon configuration
  ansible.builtin.set_fact:
    docker_daemon_effective_config: >-
      {{
        (
          (docker_daemon_existing_config | default({}))
          | combine(docker_daemon_config_with_image_store | default(docker_daemon_config), recursive=True)
        )
        | combine(docker_image_store_rollback_override | default({}), recursive=False)
      }}
  when: common_enable_docker | default(false)
  tags:
    - docker

# Normalization of the composed fact only (the daemon.json writer stays unique):
# after a rollback the feature override empties `features`, so drop the leftover
# empty object to leave the classic overlay2 file exactly as it was before.
- name: Drop an emptied Docker daemon feature set after a rollback
  ansible.builtin.set_fact:
    docker_daemon_effective_config: >-
      {{
        docker_daemon_effective_config | dict2items
        | rejectattr('key', 'eq', 'features')
        | items2dict
      }}
  when:
    - common_enable_docker | default(false)
    - docker_daemon_effective_config.features is defined
    - docker_daemon_effective_config.features | length == 0
  tags:
    - docker

# Keep the immediate pre-write file so a config dockerd rejects can be restored
# without a manual rollback. Idempotent: an identical copy reports no change.
- name: Back up the current Docker daemon configuration before writing
  ansible.builtin.copy:
    src: /etc/docker/daemon.json
    dest: /etc/docker/daemon.json.image-store.bak
    remote_src: true
    mode: "0644"
  when:
    - common_enable_docker | default(false)
    - docker_daemon_file.stat.exists
  tags:
    - docker

- name: Enforce bounded Docker json-file logs
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_effective_config | to_nice_json }}"
    mode: "0644"
  register: docker_daemon_write
  notify: Restart Docker
  when: common_enable_docker | default(false)
  tags:
    - docker

# Validate the generated file before the restart can apply it; on rejection
# restore the backup (or drop the generated file when there was none) and fail.
- name: Validate the written Docker daemon configuration
  when:
    - common_enable_docker | default(false)
    - docker_daemon_write is changed
  tags:
    - docker
  block:
    - name: Validate the generated Docker daemon configuration
      ansible.builtin.command:
        cmd: dockerd --validate --config-file /etc/docker/daemon.json
      register: docker_daemon_validate
      changed_when: false
  rescue:
    - name: Restore the backed-up Docker daemon configuration
      ansible.builtin.copy:
        src: /etc/docker/daemon.json.image-store.bak
        dest: /etc/docker/daemon.json
        remote_src: true
        mode: "0644"
      when: docker_daemon_file.stat.exists | default(false)

    - name: Remove the generated Docker daemon configuration when there was no backup
      ansible.builtin.file:
        path: /etc/docker/daemon.json
        state: absent
      when: not (docker_daemon_file.stat.exists | default(false))

    - name: Stop when the generated Docker daemon configuration is rejected
      ansible.builtin.fail:
        msg: >-
          dockerd rejected the generated /etc/docker/daemon.json
          ({{ ansible_failed_result.msg | default('no output') }}). The previous
          configuration was restored and the image store switch was not applied;
          fix the configuration and re-run the playbook.

- name: Ensure the docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  when: common_enable_docker | default(false)
  tags:
    - docker

- name: Ensure the target user can run Docker without sudo
  ansible.builtin.user:
    name: "{{ local_user }}"
    groups: docker
    append: true
  when: common_enable_docker | default(false)
  tags:
    - docker

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when: common_enable_docker | default(false)
  tags:
    - docker

# Apply the pending "Restart Docker" handler now so the image store can be
# verified against the daemon that is actually running the new daemon.json.
- name: Apply the pending Docker daemon restart before verification
  ansible.builtin.meta: flush_handlers
  when: common_enable_docker | default(false)
  tags:
    - docker

- name: Verify the Docker image store after the daemon restart
  ansible.builtin.import_tasks: image_store.yml
  vars:
    docker_image_store_phase: post
  when: common_enable_docker | default(false)
  tags:
    - docker
