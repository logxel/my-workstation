---
# Each legacy one-line .list removal below MUST carry the exact same tag list
# as its corresponding render task in main.yml, so that a tag-scoped run can
# never remove a legacy definition without (re)writing its deb822 replacement.
- name: Remove legacy Microsoft Edge source file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/microsoft-edge.list
    state: absent
  when: common_enable_edge
  tags:
    - repos
    - edge

- name: Remove legacy VS Code .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.list
    state: absent
  when: common_enable_vscode
  tags:
    - repos
    - vscode

- name: Remove legacy Microsoft Edge stable .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/microsoft-edge-stable.list
    state: absent
  when: common_enable_edge
  tags:
    - packages
    - system
    - repos
    - edge

- name: Remove legacy Brave .list definition and stale keyring
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/brave-browser-release.list
    - /usr/share/keyrings/brave-browser-archive-keyring.gpg
  when: common_enable_brave
  tags:
    - repos
    - brave

- name: Remove legacy Docker .list definition and stale keyring
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /usr/share/keyrings/docker-archive-keyring.gpg
  when: common_enable_docker
  tags:
    - packages
    - system
    - repos
    - docker

- name: Remove legacy NodeSource .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent
  when: common_enable_dev_tools
  tags:
    - packages
    - system
    - repos
    - dev-tools
    - nodejs

- name: Remove legacy Warp Terminal .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/warpdotdev.list
    state: absent
  when: common_enable_warp_terminal
  tags:
    - packages
    - system
    - repos
    - warp-terminal

- name: Remove legacy Git Core PPA .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/git-core-ppa.list
    state: absent
  when:
    - ansible_facts['distribution'] in supported_distributions
    - not common_selective_feature_run or common_enable_git_credential_oauth
  tags:
    - packages
    - system
    - repos
    - git

- name: Remove legacy CopyQ PPA artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/ppa_hluk_copyq_noble.list
    - /etc/apt/sources.list.d/ppa_hluk_copyq_resolute.list
    - /etc/apt/sources.list.d/hluk-copyq.list
    - /etc/apt/keyrings/hluk-copyq.gpg
  when: common_install_copyq
  tags:
    - repos
    - copyq

- name: Find legacy Git Core PPA source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    file_type: file
    patterns:
      - git-core-ubuntu-ppa-*.list
      - git-core-ubuntu-ppa-*.sources
  register: apt_repositories_git_core_ppa_legacy_sources
  when:
    - ansible_facts['distribution'] in supported_distributions
    - not common_selective_feature_run or common_enable_git_credential_oauth
  tags:
    - repos
    - git

- name: Remove legacy Git Core PPA source files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ apt_repositories_git_core_ppa_legacy_sources.files }}"
  when:
    - ansible_facts['distribution'] in supported_distributions
    - not common_selective_feature_run or common_enable_git_credential_oauth
    - apt_repositories_git_core_ppa_legacy_sources.matched | default(0) > 0
  tags:
    - repos
    - git

- name: Remove legacy PPA-style Git Core source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/ppa_git_core_ppa_noble.list
    - /etc/apt/sources.list.d/ppa_git_core_ppa_resolute.list
  when:
    - ansible_facts['distribution'] in supported_distributions
    - not common_selective_feature_run or common_enable_git_credential_oauth
  tags:
    - repos
    - git
