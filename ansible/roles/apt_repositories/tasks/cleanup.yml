---
# Replacements must have been rendered successfully during this run. Keep old
# keyrings: unmanaged sources may still refer to them.
- name: Remove legacy Microsoft Edge source file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/microsoft-edge.list
    state: absent
  when: apt_repositories_rendered_sources['microsoft-edge-stable'] | default(false)
  tags:
    - packages
    - system
    - repos
    - edge

- name: Remove legacy VS Code .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.list
    state: absent
  when: apt_repositories_rendered_sources['vscode'] | default(false)
  tags:
    - repos
    - vscode

- name: Remove legacy Microsoft Edge stable .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/microsoft-edge-stable.list
    state: absent
  when: apt_repositories_rendered_sources['microsoft-edge-stable'] | default(false)
  tags:
    - packages
    - system
    - repos
    - edge

- name: Remove legacy Brave .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/brave-browser-release.list
    state: absent
  when: apt_repositories_rendered_sources['brave-browser-release'] | default(false)
  tags:
    - repos
    - brave

- name: Remove legacy Docker .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  when: apt_repositories_rendered_sources['docker'] | default(false)
  tags:
    - packages
    - system
    - repos
    - docker

- name: Remove legacy NodeSource .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent
  when: apt_repositories_rendered_sources['nodesource'] | default(false)
  tags:
    - packages
    - system
    - repos
    - dev-tools
    - nodejs

- name: Remove legacy Warp Terminal .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/warpdotdev.list
    state: absent
  when: apt_repositories_rendered_sources['warpdotdev'] | default(false)
  tags:
    - packages
    - system
    - repos
    - warp-terminal

- name: Remove legacy Git Core PPA .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/git-core-ppa.list
    state: absent
  when: apt_repositories_rendered_sources['git-core-ppa'] | default(false)
  tags:
    - packages
    - system
    - repos
    - git

- name: Remove legacy CopyQ PPA artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/ppa_hluk_copyq_noble.list
    - /etc/apt/sources.list.d/ppa_hluk_copyq_resolute.list
    - /etc/apt/sources.list.d/hluk-copyq.list
  tags:
    - repos
    - copyq

- name: Find legacy Git Core PPA source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    file_type: file
    patterns:
      - git-core-ubuntu-ppa-*.list
      - git-core-ubuntu-ppa-*.sources
  register: apt_repositories_git_core_ppa_legacy_sources
  when: apt_repositories_rendered_sources['git-core-ppa'] | default(false)
  tags:
    - packages
    - system
    - repos
    - git

- name: Remove legacy Git Core PPA source files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ apt_repositories_git_core_ppa_legacy_sources.files | default([]) }}"
  when:
    - apt_repositories_rendered_sources['git-core-ppa'] | default(false)
    - apt_repositories_git_core_ppa_legacy_sources.matched | default(0) > 0
  tags:
    - packages
    - system
    - repos
    - git

- name: Remove legacy PPA-style Git Core source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/ppa_git_core_ppa_noble.list
    - /etc/apt/sources.list.d/ppa_git_core_ppa_resolute.list
  when: apt_repositories_rendered_sources['git-core-ppa'] | default(false)
  tags:
    - packages
    - system
    - repos
    - git
