---
- name: Remove obsolete managed APT source definitions
  ansible.builtin.include_tasks: cleanup.yml
  tags:
    - packages
    - system
    - repos
    - vscode
    - edge
    - brave
    - docker
    - dev-tools
    - nodejs
    - warp-terminal
    - git
    - copyq

- name: Ensure the APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: >-
    common_enable_vscode
    or common_enable_edge
    or common_enable_docker
    or common_enable_dev_tools
    or common_enable_warp_terminal
  tags:
    - packages
    - system
    - repos
    - vscode
    - edge
    - docker
    - dev-tools
    - nodejs
    - warp-terminal

- name: Install the Microsoft APT signing key into a dedicated keyring
  when: common_enable_vscode or common_enable_edge
  tags:
    - packages
    - system
    - repos
    - vscode
    - edge
  block:
    - name: Fetch the Microsoft APT signing key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        owner: root
        group: root
        mode: "0644"
        force: true
  rescue:
    - name: Warn when Microsoft APT signing key could not be refreshed
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not refresh the Microsoft APT key.
          VS Code/Edge repository operations will continue, but package installs may fail later.
          Details: {{ ansible_failed_result.msg | default('no error message provided') }}
      changed_when: false

- name: Render the VS Code repository definition
  ansible.builtin.include_tasks: render_source.yml
  vars:
    apt_source_name: vscode
    apt_source_uris: https://packages.microsoft.com/repos/code
    apt_source_suites: stable
    apt_source_components: main
    apt_source_arch: "{{ common_deb_arch }}"
    apt_source_keyring: /etc/apt/keyrings/microsoft.asc
  when: common_enable_vscode
  tags:
    - repos
    - vscode

- name: Render the Microsoft Edge repository definition
  ansible.builtin.include_tasks: render_source.yml
  vars:
    apt_source_name: microsoft-edge-stable
    apt_source_uris: https://packages.microsoft.com/repos/edge
    apt_source_suites: stable
    apt_source_components: main
    apt_source_arch: "{{ common_deb_arch }}"
    apt_source_keyring: /etc/apt/keyrings/microsoft.asc
  when: common_enable_edge
  tags:
    - packages
    - system
    - repos
    - edge

- name: Install the Brave APT signing key into a dedicated keyring
  when: common_enable_brave
  tags:
    - repos
    - brave
  block:
    - name: Fetch the Brave APT signing key
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /etc/apt/keyrings/brave-browser-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"
        force: true
  rescue:
    - name: Warn when Brave APT signing key could not be refreshed
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not refresh the Brave APT key.
          Brave repository operations will continue, but package installs may fail later.
          Details: {{ ansible_failed_result.msg | default('no error message provided') }}
      changed_when: false

- name: Register the Brave repository
  ansible.builtin.include_tasks: render_source.yml
  vars:
    apt_source_name: brave-browser-release
    apt_source_uris: https://brave-browser-apt-release.s3.brave.com/
    apt_source_suites: stable
    apt_source_components: main
    apt_source_arch: "{{ common_deb_arch }}"
    apt_source_keyring: /etc/apt/keyrings/brave-browser-archive-keyring.gpg
  when: common_enable_brave
  tags:
    - repos
    - brave

- name: Install the Docker APT signing key into a dedicated keyring
  when: common_enable_docker
  tags:
    - packages
    - system
    - repos
    - docker
  block:
    - name: Fetch the Docker APT signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
        force: true
  rescue:
    - name: Warn when Docker APT signing key could not be refreshed
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not refresh the Docker APT key.
          Docker repository operations will continue, but package installs may fail later.
          Details: {{ ansible_failed_result.msg | default('no error message provided') }}
      changed_when: false

- name: Render the Docker repository definition
  ansible.builtin.include_tasks: render_source.yml
  vars:
    apt_source_name: docker
    apt_source_uris: https://download.docker.com/linux/ubuntu
    apt_source_suites: "{{ common_ubuntu_codename }}"
    apt_source_components: stable
    apt_source_arch: "{{ common_deb_arch }}"
    apt_source_keyring: /etc/apt/keyrings/docker.asc
  when: common_enable_docker
  tags:
    - packages
    - system
    - repos
    - docker

- name: Set up the NodeSource APT repository
  when: common_enable_dev_tools
  tags:
    - packages
    - system
    - repos
    - dev-tools
    - nodejs
  block:
    - name: Fetch the NodeSource APT signing key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /tmp/nodesource-repo.asc
        mode: "0644"
        force: true

    - name: Dearmor the NodeSource APT signing key into a binary keyring
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          gpg --batch --yes --dearmor -o /etc/apt/keyrings/nodesource.gpg /tmp/nodesource-repo.asc
        executable: /bin/bash
      changed_when: true

    - name: Render the NodeSource repository definition
      ansible.builtin.include_tasks: render_source.yml
      vars:
        apt_source_name: nodesource
        apt_source_uris: "https://deb.nodesource.com/node_{{ nodesource_major_version }}.x"
        apt_source_suites: nodistro
        apt_source_components: main
        apt_source_arch: "{{ common_deb_arch }}"
        apt_source_keyring: /etc/apt/keyrings/nodesource.gpg
  rescue:
    - name: Warn when the NodeSource APT repository could not be configured
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not configure the NodeSource APT repository (key fetch, dearmor, or
          repo file render failed). Node.js package installs may fail later.
          Details: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg)
          | default('no error message provided') }}
      changed_when: false

- name: Set up the Warp Terminal APT repository
  when: common_enable_warp_terminal
  tags:
    - packages
    - system
    - repos
    - warp-terminal
  block:
    - name: Fetch the Warp Terminal APT signing key
      ansible.builtin.get_url:
        url: "{{ warp_terminal_apt_key_url }}"
        dest: /tmp/warpdotdev.asc
        mode: "0644"
        force: true

    - name: Dearmor the Warp Terminal APT signing key into a binary keyring
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          gpg --batch --yes --dearmor -o /etc/apt/keyrings/warpdotdev.gpg /tmp/warpdotdev.asc
        executable: /bin/bash
      changed_when: true

    - name: Render the Warp Terminal repository definition
      ansible.builtin.include_tasks: render_source.yml
      vars:
        apt_source_name: warpdotdev
        apt_source_uris: https://releases.warp.dev/linux/deb
        apt_source_suites: stable
        apt_source_components: main
        apt_source_arch: "{{ common_deb_arch }}"
        apt_source_keyring: /etc/apt/keyrings/warpdotdev.gpg
  rescue:
    - name: Warn when the Warp Terminal APT repository could not be configured
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not configure the Warp Terminal APT repository (key fetch, dearmor, or
          repo file render failed). Warp Terminal package installs may fail later.
          Details: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg)
          | default('no error message provided') }}
      changed_when: false

- name: Install the Git Core PPA signing key into a dedicated keyring
  when:
    - ansible_facts['distribution'] in supported_distributions
    - not common_selective_feature_run or common_enable_git_credential_oauth
  tags:
    - packages
    - system
    - repos
    - git
  block:
    - name: Fetch the Git Core PPA signing key
      ansible.builtin.get_url:
        url: >-
          https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF911AB184317630C59970973E363C90F8F1B6217
        dest: /etc/apt/keyrings/git-core-ppa.asc
        owner: root
        group: root
        mode: "0644"
        force: true
  rescue:
    - name: Warn when Git Core PPA signing key could not be refreshed
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not refresh the Git Core PPA key from keyserver.ubuntu.com.
          Continuing bootstrap with the currently available keyring file.
          Details: {{ ansible_failed_result.msg | default('no error message provided') }}
      changed_when: false

- name: Render the Git Core PPA repository definition
  ansible.builtin.include_tasks: render_source.yml
  vars:
    apt_source_name: git-core-ppa
    apt_source_uris: https://ppa.launchpadcontent.net/git-core/ppa/ubuntu
    apt_source_suites: "{{ common_ubuntu_codename }}"
    apt_source_components: main
    apt_source_keyring: /etc/apt/keyrings/git-core-ppa.asc
  when:
    - ansible_facts['distribution'] in supported_distributions
    - not common_selective_feature_run or common_enable_git_credential_oauth
  tags:
    - packages
    - system
    - repos
    - git

- name: Update apt cache after adding external repositories
  when: >-
    common_enable_vscode
    or common_enable_brave
    or common_enable_docker
    or common_enable_edge
    or common_enable_dev_tools
    or common_enable_warp_terminal
    or (
      ansible_facts['distribution'] in supported_distributions
      and (not common_selective_feature_run or common_enable_git_credential_oauth)
    )
  tags:
    - packages
    - system
    - repos
  block:
    - name: Refresh the apt cache
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
  rescue:
    - name: Warn when apt cache update fails and continue
      ansible.builtin.debug:
        msg: >-
          WARNING: apt cache update failed, so package metadata may be stale for this run.
          Bootstrap will continue.
          Details: {{ ansible_failed_result.msg | default('no error message provided') }}
      changed_when: false
