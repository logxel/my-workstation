---
- name: Look up the target user's numeric UID
  ansible.builtin.command:
    cmd: id -u {{ local_user }}
  become: false
  register: nix_teardown_local_user_id
  changed_when: false
  tags:
    - nix-teardown

- name: Stop and disable the workstation-auto-clean user timer and service # noqa: ignore-errors
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: false
    state: stopped
  become: false
  loop:
    - workstation-auto-clean.timer
    - workstation-auto-clean.service
  environment:
    XDG_RUNTIME_DIR: >-
      {{
        lookup('ansible.builtin.env', 'XDG_RUNTIME_DIR')
        | default('/run/user/' ~ nix_teardown_local_user_id.stdout | trim, true)
      }}
    DBUS_SESSION_BUS_ADDRESS: "{{ lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') }}"
  register: nix_teardown_disable_timer
  ignore_errors: true
  tags:
    - nix-teardown

- name: Report when the workstation-auto-clean timer could not be disabled # noqa: ignore-errors
  ansible.builtin.debug:
    msg: >-
      Could not disable the workstation-auto-clean user timer (it may already be gone, or
      there is no active user systemd session in this run). Continuing teardown.
  when: >-
    nix_teardown_disable_timer.results | default([])
    | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
  changed_when: false
  tags:
    - nix-teardown

- name: Remove the workstation-auto-clean systemd unit files installed by Home Manager
  ansible.builtin.file:
    path: "{{ local_home }}/.config/systemd/user/{{ item }}"
    state: absent
  become: false
  loop:
    - workstation-auto-clean.timer
    - workstation-auto-clean.service
  tags:
    - nix-teardown

- name: Check which Bun compat wrappers point into the Nix store
  ansible.builtin.stat:
    path: "{{ local_home }}/.local/bin/{{ item }}"
  become: false
  loop:
    - npm
    - npx
    - yarn
    - pnpm
  register: nix_teardown_compat_wrapper_stat
  tags:
    - nix-teardown

- name: Remove Nix-store-linked Bun compat wrappers
  ansible.builtin.file:
    path: "{{ local_home }}/.local/bin/{{ item.item }}"
    state: absent
  become: false
  loop: "{{ nix_teardown_compat_wrapper_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat.exists
    - item.stat.islnk | default(false)
    - item.stat.lnk_source is defined
    - "'/nix/store/' in item.stat.lnk_source"
  tags:
    - nix-teardown

- name: Delete the Home Manager named and legacy Nix profiles
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: false
  loop:
    - "{{ common_home_manager_profile_path }}"
    - "{{ common_home_manager_legacy_profile_path }}"
    - "{{ common_home_manager_state_legacy_profile_path }}"
    - "{{ common_home_manager_global_legacy_profile_path }}"
  tags:
    - nix-teardown

- name: Check whether Home Manager's own CLI is symlinked into the default Nix profile
  ansible.builtin.stat:
    path: "{{ common_nix_default_profile_path }}/bin/home-manager"
  become: false
  register: nix_teardown_default_profile_hm_marker
  tags:
    - nix-teardown

- name: Delete the default Nix profile when Home Manager activated into it
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: false
  loop:
    - "{{ common_nix_default_profile_path }}"
    - "{{ common_nix_profile_symlink_path }}"
  when:
    - nix_teardown_default_profile_hm_marker.stat.exists
  tags:
    - nix-teardown

- name: Report when the default Nix profile was left alone
  ansible.builtin.debug:
    msg: >-
      {{ common_nix_profile_symlink_path }} has no bin/home-manager marker, so it
      does not look Home-Manager-owned and teardown left it in place. Inspect
      {{ common_nix_default_profile_path }}/manifest.nix by hand if Warp/bun/uv/etc.
      are still resolving from the Nix store afterward.
  when:
    - not nix_teardown_default_profile_hm_marker.stat.exists
  changed_when: false
  tags:
    - nix-teardown

- name: Stat the dotfiles Home Manager's activation may have displaced, and their backups
  ansible.builtin.stat:
    path: "{{ local_home }}/{{ item }}"
  become: false
  loop:
    - .zshrc
    - .zshenv
    - .zshrc.home-manager-backup
    - .zshenv.home-manager-backup
  loop_control:
    label: "{{ item }}"
  register: nix_teardown_dotfile_stats
  tags:
    - nix-teardown

- name: Derive restore/remove/report actions for the displaced dotfiles
  ansible.builtin.set_fact:
    nix_teardown_dotfile_plan: >-
      {{
        nix_teardown_dotfile_plan | default([]) + [{
          'file': item,
          'is_hm_symlink': (
            file_stat.stat.exists
            and (file_stat.stat.islnk | default(false))
            and (file_stat.stat.lnk_source is defined)
            and ('/nix/store/' in file_stat.stat.lnk_source)
          ),
          'has_backup': backup_stat.stat.exists,
        }]
      }}
  loop: "{{ ['.zshrc', '.zshenv'] }}"
  loop_control:
    label: "{{ item }}"
  vars:
    file_stat: "{{ nix_teardown_dotfile_stats.results | selectattr('item', 'equalto', item) | first }}"
    backup_stat: >-
      {{
        nix_teardown_dotfile_stats.results
        | selectattr('item', 'equalto', item ~ '.home-manager-backup') | first
      }}
  tags:
    - nix-teardown

- name: Restore backed-up dotfiles that Home Manager's activation had displaced
  ansible.builtin.command:
    cmd: mv -v "{{ local_home }}/{{ item.file }}.home-manager-backup" "{{ local_home }}/{{ item.file }}"
  become: false
  loop: "{{ nix_teardown_dotfile_plan }}"
  loop_control:
    label: "{{ item.file }}"
  register: nix_teardown_restore_dotfiles
  changed_when: nix_teardown_restore_dotfiles.rc == 0
  ignore_errors: true # noqa: ignore-errors
  when:
    - item.is_hm_symlink
    - item.has_backup
  tags:
    - nix-teardown

- name: Remove Home-Manager-owned dotfiles that have no backup to restore
  ansible.builtin.file:
    path: "{{ local_home }}/{{ item.file }}"
    state: absent
  become: false
  loop: "{{ nix_teardown_dotfile_plan }}"
  loop_control:
    label: "{{ item.file }}"
  when:
    - item.is_hm_symlink
    - not item.has_backup
  tags:
    - nix-teardown

- name: Report dotfiles removed without a backup to restore
  ansible.builtin.debug:
    msg: >-
      {{ local_home }}/{{ item.file }} pointed into the Nix store with no
      *.home-manager-backup to restore, so it was deleted outright. Re-run the
      normal playbook (shell_config role) to regenerate it if it's expected to exist.
  loop: "{{ nix_teardown_dotfile_plan }}"
  loop_control:
    label: "{{ item.file }}"
  when:
    - item.is_hm_symlink
    - not item.has_backup
  changed_when: false
  tags:
    - nix-teardown

- name: Remove the stale Nix installer line from ~/.profile
  ansible.builtin.lineinfile:
    path: "{{ local_home }}/.profile"
    regexp: '.*added by Nix installer.*'
    state: absent
  become: false
  tags:
    - nix-teardown

- name: Remove leftover ~/.nix-defexpr (broken channels_root symlink)
  ansible.builtin.file:
    path: "{{ local_home }}/.nix-defexpr"
    state: absent
  become: false
  tags:
    - nix-teardown

- name: Flip the nix feature flag off so future runs stop re-activating Home Manager
  ansible.builtin.debug:
    msg: >-
      Home Manager has been torn down. Set feature_flags.nix: disabled in
      ansible/group_vars/all/override.yml if you no longer want this host to
      reinstall the Nix binary either, then re-run the normal playbook so
      shell_config/dev_tools/desktop_apps replace what Home Manager used to manage.
  changed_when: false
  tags:
    - nix-teardown

- name: Garbage collect the now-unreferenced Nix store paths
  tags:
    - nix-teardown
  block:
    - name: Run nix-collect-garbage -d
      ansible.builtin.command:
        cmd: nix-collect-garbage -d
      become: false
      environment:
        PATH: >-
          {{
            (ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'))
            + ':/nix/var/nix/profiles/default/bin:'
            + local_home
            + '/.nix-profile/bin'
          }}
      changed_when: false
  rescue:
    - name: Warn when the deep Nix garbage collection failed
      ansible.builtin.debug:
        msg: >-
          WARNING: `nix-collect-garbage -d` failed or Nix is not on PATH in this run.
          Re-run manually once a shell session with Nix sourced is available.
          Details: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg)
          | default('no error message provided') }}
      changed_when: false
