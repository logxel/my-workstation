---
# Shared discovery prelude: runs regardless of feature state so both branches
# use the same verified view. A swap signature proves file type, not ownership;
# only files with a root-owned role marker may be rotated or removed.
- name: Discover swap state
  tags:
    - swap
  block:
    - name: Identify swap-file paths managed by this role
      ansible.builtin.set_fact:
        swap_path_alt: "{{ swap_file_path ~ '.1' if swap_file_path[-2:] != '.1' else swap_file_path[:-2] }}"
        swap_ownership_marker_suffix: ".my-workstation-managed"
        swap_managed_paths:
          - "{{ swap_file_path }}"
          - "{{ swap_file_path ~ '.1' if swap_file_path[-2:] != '.1' else swap_file_path[:-2] }}"

    - name: Inspect role ownership markers for configured swap paths
      ansible.builtin.stat:
        path: "{{ item }}{{ swap_ownership_marker_suffix }}"
        follow: false
      loop: "{{ swap_managed_paths }}"
      register: swap_ownership_markers

    - name: Record configured swap paths owned by this role
      ansible.builtin.set_fact:
        swap_owned_paths: "{{ swap_ownership_markers.results
          | selectattr('stat.isreg')
          | selectattr('stat.pw_name', 'equalto', 'root')
          | map(attribute='item')
          | list }}"

    - name: Read active swap entries from proc
      ansible.builtin.command:
        cmd: cat /proc/swaps
      register: swap_proc
      changed_when: false

    - name: Read fstab contents
      ansible.builtin.slurp:
        src: /etc/fstab
      register: swap_fstab

    - name: Identify active file swaps and fstab swap paths
      ansible.builtin.set_fact:
        swap_active_files: "{{ swap_proc.stdout_lines[1:]
          | select('search', '\\sfile\\s')
          | map('split')
          | map('first')
          | list }}"
        swap_fstab_files: "{{ (swap_fstab.content | b64decode).splitlines()
          | map('regex_replace', '^\\s*#\\s*', '')
          | map('trim')
          | reject('equalto', '')
          | select('search', '^\\S+\\s+\\S+\\s+swap\\s')
          | map('split')
          | map('first')
          | select('match', '^/')
          | reject('match', '^/dev/')
          | list
          | unique }}"

    - name: Build swap candidate list
      ansible.builtin.set_fact:
        swap_candidates: "{{ (swap_active_files + swap_fstab_files + swap_managed_paths)
          | unique
          | select('in', swap_managed_paths)
          | list }}"

    - name: Stat swap candidates
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ swap_candidates }}"
      register: swap_candidates_stat

    - name: Select inactive regular-file candidates
      ansible.builtin.set_fact:
        swap_inactive_regular: "{{ swap_candidates_stat.results
          | default([])
          | selectattr('stat.exists')
          | selectattr('stat.isreg')
          | map(attribute='item')
          | list
          | difference(swap_active_files) }}"

    - name: Probe inactive swap candidates for swap signature
      ansible.builtin.command:
        cmd: blkid -p -o value -s TYPE "{{ item }}"
      loop: "{{ swap_inactive_regular }}"
      register: swap_probe
      changed_when: false
      ignore_errors: true  # noqa: ignore-errors

    - name: Collect signature-verified swap files
      ansible.builtin.set_fact:
        swap_sig_files: "{{ swap_probe.results
          | default([])
          | selectattr('stdout', 'defined')
          | selectattr('stdout', 'search', '^swap')
          | map(attribute='item')
          | list }}"

    - name: Compute verified swap removal set
      ansible.builtin.set_fact:
        swap_verified_removals: "{{ (swap_active_files + swap_sig_files)
          | unique
          | select('in', swap_owned_paths)
          | list }}"

- name: Calculate swap file size from available RAM
  when: common_enable_swap | default(false)
  tags:
    - swap
  block:
    - name: Derive swap ratio from total RAM
      ansible.builtin.set_fact:
        swap_ratio: "{{ 2.0 if (ansible_facts['memtotal_mb'] < 8192)
          else 1.5 if (ansible_facts['memtotal_mb'] < 16384)
          else 0.75 if (ansible_facts['memtotal_mb'] < 32768)
          else 0.5 }}"

    - name: Derive swap file size in MiB
      ansible.builtin.set_fact:
        swap_size_mb: >-
          {{
            [
              ((ansible_facts['memtotal_mb'] | int) * (swap_ratio | float)) | int,
              4096
            ] | max
          }}

    - name: Clamp swap file size to maximum
      ansible.builtin.set_fact:
        swap_size_mb: "{{ [swap_size_mb | int, 32768] | min }}"

    - name: Report planned swap file
      ansible.builtin.debug:
        msg: >-
          RAM {{ ansible_facts['memtotal_mb'] | int // 1024 }} GiB →
          swap ratio {{ swap_ratio }} → swap file {{ swap_size_mb }} MiB
          at {{ swap_file_path }} (priority {{ swap_priority }})

- name: Teardown swap when feature is disabled
  when: not (common_enable_swap | default(false))
  tags:
    - swap
  block:
    - name: Deactivate verified swap files
      ansible.builtin.command:
        cmd: swapoff "{{ item }}"
      loop: "{{ swap_verified_removals }}"
      when: item in swap_active_files
      changed_when: true

    - name: Remove verified swap files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ swap_verified_removals }}"

    - name: Remove verified swap entries from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*#?\s*{{ item | regex_escape }}\s+'
        state: absent
      loop: "{{ swap_verified_removals }}"

    - name: Remove ownership markers for retired swap files
      ansible.builtin.file:
        path: "{{ item }}{{ swap_ownership_marker_suffix }}"
        state: absent
      loop: "{{ swap_verified_removals }}"

    - name: Confirm teardown
      ansible.builtin.debug:
        msg: "Swap disabled — removed only swap files marked as managed by this role"

- name: Setup swap file when feature is enabled
  when: common_enable_swap | default(false)
  tags:
    - swap
  block:
    - name: Stat managed swap file paths
      ansible.builtin.stat:
        path: "{{ item }}"
      register: swap_paths_stat
      loop:
        - "{{ swap_file_path }}"
        - "{{ swap_path_alt }}"

    - name: Determine current active managed swap
      ansible.builtin.set_fact:
        swap_current: "{{ swap_file_path if (swap_file_path in swap_active_files)
          else swap_path_alt if (swap_path_alt in swap_active_files)
          else none }}"

    - name: Determine current active managed swap size
      ansible.builtin.set_fact:
        swap_current_size: "{{ swap_paths_stat.results[0].stat.size if swap_current == swap_file_path
          else swap_paths_stat.results[1].stat.size if swap_current == swap_path_alt
          else 0 }}"

    - name: Check if current swap needs migration
      ansible.builtin.set_fact:
        swap_needs_migration: "{{ swap_current is none
          or (
            swap_current in swap_owned_paths
            and (((swap_current_size | int) - ((swap_size_mb | int) * 1024 * 1024)) | abs) >= 1048576
          ) }}"

    - name: Determine next swap path for rotation
      ansible.builtin.set_fact:
        swap_next: "{{ swap_path_alt if swap_current == swap_file_path else swap_file_path }}"

    - name: Inspect the next swap path before rotation
      ansible.builtin.stat:
        path: "{{ swap_next }}"
      register: swap_next_stat
      when: swap_needs_migration

    - name: Refuse to retire the current swap when the active alternate is undersized
      ansible.builtin.fail:
        msg: >-
          Refusing to remove {{ swap_current }} because {{ swap_next }} is already
          active but does not match the requested {{ swap_size_mb }} MiB size.
          Resolve the alternate swap manually before retrying.
      when:
        - swap_needs_migration
        - swap_next in swap_active_files
        - ((swap_next_stat.stat.size | int) - ((swap_size_mb | int) * 1024 * 1024)) | abs >= 1048576

    - name: Refuse to overwrite an unowned or unverified file at the swap target
      ansible.builtin.fail:
        msg: >-
          Refusing to replace {{ swap_next }} because it exists without a valid,
          root-owned {{ swap_ownership_marker_suffix }} marker and verified swap
          signature. Inspect it before explicitly adopting it for this role.
      when:
        - swap_needs_migration
        - swap_next_stat.stat.exists
        - swap_next not in swap_verified_removals

    - name: Derive final swap target
      ansible.builtin.set_fact:
        swap_final: "{{ swap_next if swap_needs_migration else swap_current }}"

    - name: Compute managed swap removals
      ansible.builtin.set_fact:
        swap_removals: "{{ swap_verified_removals | reject('equalto', swap_final) | list }}"

    - name: Report swap state
      ansible.builtin.debug:
        msg:
          - "Active: {{ swap_current | default('none') }} ({{ swap_current_size }} bytes)"
          - "Desired: {{ swap_size_mb }} MiB ({{ swap_size_mb | int * 1024 * 1024 }} bytes)"
          - "Final: {{ swap_final }}"
          - "Removals: {{ swap_removals }}"
          - "Migration needed: {{ swap_needs_migration }}"

    - name: Migrate swap with zero-downtime rotation
      when: swap_needs_migration
      block:
        - name: Remove stale file at new swap path
          ansible.builtin.file:
            path: "{{ swap_next }}"
            state: absent
          when: swap_next not in swap_active_files

        - name: Create new swap file
          ansible.builtin.command:
            cmd: fallocate -l "{{ swap_size_mb }}M" "{{ swap_next }}"
          when: swap_next not in swap_active_files
          changed_when: true

        - name: Set secure permissions
          ansible.builtin.file:
            path: "{{ swap_next }}"
            mode: "0600"
          when: swap_next not in swap_active_files

        - name: Format as swap
          ansible.builtin.command:
            cmd: mkswap "{{ swap_next }}"
          when: swap_next not in swap_active_files
          changed_when: true

        - name: Activate new swap (old stays active)
          ansible.builtin.command:
            cmd: swapon -p "{{ swap_priority }}" "{{ swap_next }}"
          when: swap_next not in swap_active_files
          changed_when: true

        - name: Mark the new swap file as owned by this role
          ansible.builtin.copy:
            dest: "{{ swap_next }}{{ swap_ownership_marker_suffix }}"
            content: "{{ swap_next }}\n"
            owner: root
            group: root
            mode: "0600"
          when: swap_next not in swap_active_files

    # The replacement is created/formatted/activated before the old swap is
    # swapped off, so the machine always has headroom. A failed swapoff must
    # abort before any file removal: unlinking a still-active swap discards
    # live pages.
    - name: Deactivate obsolete swap files
      ansible.builtin.command:
        cmd: swapoff "{{ item }}"
      loop: "{{ swap_removals }}"
      when: item in swap_active_files
      changed_when: true

    - name: Remove obsolete swap files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ swap_removals }}"

    - name: Remove obsolete swap entries from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*#?\s*{{ item | regex_escape }}\s+'
        state: absent
      loop: "{{ swap_removals }}"

    - name: Remove ownership markers for obsolete swap files
      ansible.builtin.file:
        path: "{{ item }}{{ swap_ownership_marker_suffix }}"
        state: absent
      loop: "{{ swap_removals }}"

    - name: Ensure correct swap entry in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*#?\s*{{ swap_final | regex_escape }}\s+'
        line: "{{ swap_final }} none swap sw,pri={{ swap_priority }} 0 0"
        state: present
        backup: true
      when: swap_needs_migration or swap_current in swap_owned_paths
