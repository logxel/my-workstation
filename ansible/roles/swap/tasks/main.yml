---
- name: Calculate swap file size from available RAM
  when: common_enable_swap | default(false)
  tags:
    - swap
  block:
    - name: Derive swap ratio from total RAM
      ansible.builtin.set_fact:
        swap_ratio: >-
          {{
            2.0 if (ansible_facts['memtotal_mb'] < 8192)
            else 1.5 if (ansible_facts['memtotal_mb'] < 16384)
            else 0.75 if (ansible_facts['memtotal_mb'] < 32768)
            else 0.5
          }}

    - name: Derive swap file size in MiB
      ansible.builtin.set_fact:
        swap_size_mb: >-
          {{
            [
              ((ansible_facts['memtotal_mb'] | int) * (swap_ratio | float)) | int,
              4096
            ] | max
          }}

    - name: Clamp swap file size to maximum
      ansible.builtin.set_fact:
        swap_size_mb: "{{ [swap_size_mb | int, 32768] | min }}"

    - name: Report planned swap file
      ansible.builtin.debug:
        msg: >-
          RAM {{ ansible_facts['memtotal_mb'] | int // 1024 }} GiB →
          swap ratio {{ swap_ratio }} → swap file {{ swap_size_mb }} MiB
          at {{ swap_file_path }} (priority {{ swap_priority }})

- name: Teardown swap when feature is disabled
  when: not (common_enable_swap | default(false))
  tags:
    - swap
  block:
    - name: Derive alternate swap file path
      ansible.builtin.set_fact:
        swap_path_alt: >-
          {{ swap_file_path ~ '.1' if swap_file_path[-2:] != '.1' else swap_file_path[:-2] }}

    - name: Get list of active swaps
      ansible.builtin.command: cat /proc/swaps
      register: swap_teardown_active
      changed_when: false
      failed_when: false

    - name: Deactivate all swap files
      ansible.builtin.command:
        cmd: swapoff "{{ item }}"
      loop:
        - "{{ swap_file_path }}"
        - "{{ swap_path_alt }}"
      when: item in swap_teardown_active.stdout
      changed_when: true

    - name: Remove swap files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ swap_file_path }}"
        - "{{ swap_path_alt }}"

    - name: Comment out all swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: "^([^#].*\\s+swap\\s+.*)$"
        replace: "# \\1"

    - name: Confirm teardown
      ansible.builtin.debug:
        msg: "Swap disabled — removed swap files and fstab entries"

- name: Setup swap file when feature is enabled
  when: common_enable_swap | default(false)
  tags:
    - swap
  block:
    - name: Derive alternate swap file path
      ansible.builtin.set_fact:
        swap_path_alt: >-
          {{ swap_file_path ~ '.1' if swap_file_path[-2:] != '.1' else swap_file_path[:-2] }}

    - name: Get list of active swaps
      ansible.builtin.command: cat /proc/swaps
      register: swap_active_list
      changed_when: false

    - name: Stat known swap file paths
      ansible.builtin.stat:
        path: "{{ item }}"
      register: swap_paths_stat
      loop:
        - "{{ swap_file_path }}"
        - "{{ swap_path_alt }}"

    - name: Determine current active swap and its size
      ansible.builtin.set_fact:
        swap_current: >-
          {{
            swap_file_path if (swap_paths_stat.results[0].stat.exists
              and swap_file_path in swap_active_list.stdout)
            else swap_path_alt if (swap_paths_stat.results[1].stat.exists
              and swap_path_alt in swap_active_list.stdout)
            else None
          }}
        swap_current_size: >-
          {{
            swap_paths_stat.results[0].stat.size if (swap_paths_stat.results[0].stat.exists
              and swap_file_path in swap_active_list.stdout)
            else swap_paths_stat.results[1].stat.size if (swap_paths_stat.results[1].stat.exists
              and swap_path_alt in swap_active_list.stdout)
            else 0
          }}

    - name: Determine next swap path for rotation
      ansible.builtin.set_fact:
        swap_next: "{{ swap_path_alt if swap_current == swap_file_path else swap_file_path }}"

    - name: Check if current swap needs migration
      ansible.builtin.set_fact:
        swap_needs_migration: >-
          {{
            swap_current == None
            or ((swap_current_size | int - swap_size_mb | int * 1024 * 1024) | abs >= 1048576)
          }}

    - name: Report swap state
      ansible.builtin.debug:
        msg:
          - "Active: {{ swap_current | default('none') }} ({{ swap_current_size }} bytes)"
          - "Desired: {{ swap_size_mb }} MiB ({{ swap_size_mb | int * 1024 * 1024 }} bytes)"
          - "Next: {{ swap_next }}"
          - "Migration needed: {{ swap_needs_migration }}"

    - name: Migrate swap with zero-downtime rotation
      when: swap_needs_migration
      block:
        - name: Remove stale file at alternate path
          ansible.builtin.file:
            path: "{{ swap_next }}"
            state: absent
          when: swap_paths_stat.results[0 if swap_next == swap_file_path else 1].stat.exists

        - name: Create new swap file
          ansible.builtin.command:
            cmd: fallocate -l "{{ swap_size_mb }}M" "{{ swap_next }}"
          changed_when: true

        - name: Set secure permissions
          ansible.builtin.file:
            path: "{{ swap_next }}"
            mode: "0600"

        - name: Format as swap
          ansible.builtin.command: mkswap "{{ swap_next }}"
          changed_when: true

        - name: Activate new swap (old stays active)
          ansible.builtin.command: swapon -p "{{ swap_priority }}" "{{ swap_next }}"
          changed_when: true

        - name: Deactivate old swap
          ansible.builtin.command: swapoff "{{ swap_current }}"
          when: swap_current != None
          failed_when: false
          changed_when: true

        - name: Remove old swap file
          ansible.builtin.file:
            path: "{{ swap_current }}"
            state: absent
          when: swap_current != None

        - name: Update current swap reference
          ansible.builtin.set_fact:
            swap_current: "{{ swap_next }}"

    - name: Comment out all swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: "^([^#].*\\s+swap\\s+.*)$"
        replace: "# \\1"

    - name: Ensure correct swap entry in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^{{ swap_current | regex_escape }}\\s+"
        line: "{{ swap_current }} none swap sw,pri={{ swap_priority }} 0 0"
        state: present
