---
- name: Remove legacy clip-win package when migrating to clipboard-history
  ansible.builtin.apt:
    name: clip-win
    state: absent
    purge: true
    autoremove: true
  when: "'clip-win' in ansible_facts.packages"
  tags:
    - clipboard-history

- name: Remove legacy clip-win config directory
  ansible.builtin.file:
    path: "{{ local_home }}/.config/clip-win"
    state: absent
  become: false
  tags:
    - clipboard-history

- name: Remove legacy clip-win autostart entry
  ansible.builtin.file:
    path: "{{ local_home }}/.config/autostart/clip-win.desktop"
    state: absent
  become: false
  tags:
    - clipboard-history

- name: Remove legacy CopyQ packages when migrating to clipboard-history
  ansible.builtin.apt:
    name:
      - copyq
      - copyq-plugins
    state: absent
    purge: true
    autoremove: true
  tags:
    - clipboard-history
    - copyq

- name: Remove legacy CopyQ config directory when migrating to clipboard-history
  ansible.builtin.file:
    path: "{{ local_home }}/.config/copyq"
    state: absent
  become: false
  tags:
    - clipboard-history
    - copyq

- name: Download clipboard-history install script
  ansible.builtin.get_url:
    url: >-
      https://raw.githubusercontent.com/axellpadilla/clipboard-history/{{
        clipboard_history_branch
      }}/install-with-cargo-systemd.sh
    dest: /tmp/install-ringboard.sh
    mode: "0755"
  tags:
    - clipboard-history

- name: Patch upstream install script to tolerate missing services on first run
  ansible.builtin.lineinfile:
    path: /tmp/install-ringboard.sh
    regexp: '^systemctl --user stop ringboard-server$'
    line: 'systemctl --user stop ringboard-server 2>/dev/null || true'
  tags:
    - clipboard-history

- name: Install Ringboard with Iced GUI via official install script
  tags:
    - clipboard-history
  block:
    - name: Run the Ringboard official install script
      ansible.builtin.command:
        cmd: /tmp/install-ringboard.sh
      environment:
        RINGBOARD_CLIENT: iced
        RINGBOARD_REPO: axellpadilla/clipboard-history
        RINGBOARD_BRANCH: "{{ clipboard_history_branch }}"
        PATH: "{{ local_home }}/.cargo/bin:{{ lookup('env', 'PATH') }}"
        XDG_SESSION_TYPE: "{{ lookup('ansible.builtin.env', 'XDG_SESSION_TYPE') }}"
        XDG_CURRENT_DESKTOP: "{{ lookup('ansible.builtin.env', 'XDG_CURRENT_DESKTOP') }}"
        DISPLAY: "{{ lookup('ansible.builtin.env', 'DISPLAY') }}"
        DBUS_SESSION_BUS_ADDRESS: "{{ lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') }}"
        XDG_RUNTIME_DIR: "{{ lookup('ansible.builtin.env', 'XDG_RUNTIME_DIR') }}"
      become: false
      changed_when: true
  rescue:
    - name: Warn when Ringboard install script fails
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not install Ringboard via the official script.
          Bootstrap will continue without failing this optional feature.
          Details: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg)
          | default('no error message provided') }}
      changed_when: false

- name: Remove stale egui desktop entry (install script only keeps the active client)
  ansible.builtin.file:
    path: "{{ local_home }}/.local/share/applications/ringboard-egui.desktop"
    state: absent
  become: false
  tags:
    - clipboard-history

# --- COSMIC Desktop Shortcut (Super+V) ---

- name: Ensure COSMIC shortcut config directory exists for clipboard-history
  ansible.builtin.file:
    path: "{{ local_home }}/.config/cosmic/com.system76.CosmicSettings.Shortcuts/v1"
    state: directory
    mode: "0700"
  when:
    - common_clipboard_history_is_cosmic
  become: false
  tags:
    - clipboard-history

- name: Ensure clipboard-history Super+V shortcut is present for COSMIC
  ansible.builtin.shell: |
    set -eo pipefail
    shortcut_file="{{ local_home }}/.config/cosmic/com.system76.CosmicSettings.Shortcuts/v1/custom"
    if [ -f "$shortcut_file" ] && grep -Fq 'ringboard-iced' "$shortcut_file"; then
      exit 0
    fi
    entry='    (
        modifiers: [
            Super,
        ],
        key: "v",
        description: Some("Clipboard History"),
    ): Spawn("{{ local_home }}/.cargo/bin/ringboard-iced toggle"),'
    if [ ! -f "$shortcut_file" ] || [ ! -s "$shortcut_file" ]; then
      printf '{\n%s\n}\n' "$entry" > "$shortcut_file"
      exit 0
    fi
    tmp_file="$(mktemp)"
    awk -v entry="$entry" '
      /}[[:space:]]*$/ && !done { print entry; done=1 }
      { print }
      END {
        if (!done) {
          print "{";
          print entry;
          print "}";
        }
      }
    ' "$shortcut_file" > "$tmp_file"
    mv "$tmp_file" "$shortcut_file"
  args:
    executable: /bin/bash
  when:
    - common_clipboard_history_is_cosmic
  become: false
  changed_when: false
  tags:
    - clipboard-history

- name: Ensure COSMIC_DATA_CONTROL_ENABLED is set for Wayland clipboard support
  ansible.builtin.copy:
    dest: /etc/profile.d/clipboard.sh
    content: |
      export COSMIC_DATA_CONTROL_ENABLED=1
    mode: "0644"
  when:
    - common_clipboard_history_is_cosmic
    - lookup('ansible.builtin.env', 'XDG_SESSION_TYPE') == 'wayland'
  tags:
    - clipboard-history

# --- GNOME Desktop Shortcut (Super+V) ---

- name: Report when GNOME shortcut integration is skipped due missing desktop session environment
  ansible.builtin.debug:
    msg: >-
      Skipping GNOME clipboard-history shortcut integration because DBUS_SESSION_BUS_ADDRESS is not available.
  when:
    - common_clipboard_history_is_gnome_family
    - lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') | length == 0
  changed_when: false
  tags:
    - clipboard-history

- name: Ensure GNOME notification center no longer claims Super+V
  when:
    - common_clipboard_history_is_gnome_family
    - lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') | length > 0
  become: false
  tags:
    - clipboard-history
  block:
    - name: Remap GNOME notification center toggle-message-tray binding
      ansible.builtin.command:
        argv:
          - gsettings
          - set
          - org.gnome.shell.keybindings
          - toggle-message-tray
          - "['<Super><Shift>v']"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') }}"
        DISPLAY: "{{ lookup('ansible.builtin.env', 'DISPLAY') }}"
        XDG_RUNTIME_DIR: "{{ lookup('ansible.builtin.env', 'XDG_RUNTIME_DIR') }}"
      changed_when: false
  rescue:
    - name: Warn when GNOME notification center shortcut remap fails
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not set org.gnome.shell.keybindings.toggle-message-tray for clipboard-history.
          Bootstrap will continue.
          Details: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg)
          | default('no error message provided') }}
      changed_when: false

- name: Ensure GNOME quick settings no longer claims Super+V
  when:
    - common_clipboard_history_is_gnome_family
    - lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') | length > 0
  become: false
  tags:
    - clipboard-history
  block:
    - name: Remap GNOME quick settings toggle-quick-settings binding
      ansible.builtin.command:
        argv:
          - gsettings
          - set
          - org.gnome.shell.keybindings
          - toggle-quick-settings
          - "[]"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') }}"
        DISPLAY: "{{ lookup('ansible.builtin.env', 'DISPLAY') }}"
        XDG_RUNTIME_DIR: "{{ lookup('ansible.builtin.env', 'XDG_RUNTIME_DIR') }}"
      changed_when: false
  rescue:
    - name: Warn when GNOME quick settings shortcut remap fails
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not set org.gnome.shell.keybindings.toggle-quick-settings for clipboard-history.
          Bootstrap will continue.
          Details: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg)
          | default('no error message provided') }}
      changed_when: false

- name: Ensure clipboard-history GNOME custom shortcut is registered
  when:
    - common_clipboard_history_is_gnome_family
    - lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') | length > 0
  become: false
  tags:
    - clipboard-history
  block:
    - name: Register the clipboard-history GNOME custom shortcut
      ansible.builtin.shell: |
        set -eo pipefail
        base='/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings'
        entry="${base}/clipboard-history/"
        current="$(dconf read "${base}")"
        if [ -z "$current" ] || [ "$current" = "@as []" ]; then
          dconf write "${base}" "['${entry}']"
        elif ! echo "$current" | grep -Fq "$entry"; then
          new_list="$(echo "$current" | sed "s|]\$|, '${entry}']|")"
          dconf write "${base}" "$new_list"
        fi
        dconf write "${entry}binding" "'<Super>v'"
        dconf write "${entry}command" "'{{ local_home }}/.cargo/bin/ringboard-iced toggle'"
        dconf write "${entry}name" "'Clipboard History'"
      args:
        executable: /bin/bash
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') }}"
        DISPLAY: "{{ lookup('ansible.builtin.env', 'DISPLAY') }}"
        XDG_RUNTIME_DIR: "{{ lookup('ansible.builtin.env', 'XDG_RUNTIME_DIR') }}"
      changed_when: false
  rescue:
    - name: Warn when GNOME custom shortcut registration fails
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not register the clipboard-history custom GNOME shortcut.
          Bootstrap will continue.
          Details: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg)
          | default('no error message provided') }}
      changed_when: false
