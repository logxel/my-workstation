---
- name: Stop when Docker Desktop is installed without explicit replacement approval
  ansible.builtin.fail:
    msg: >-
      Docker Desktop is installed on this host. This playbook manages Docker Engine only and will not
      replace Docker Desktop unless you explicitly approve it. Set docker_desktop_cleanup_approved=true
      in ansible/group_vars/all/override.yml or pass --extra-vars
      docker_desktop_cleanup_approved=true to remove the docker-desktop package, migrate
      {{ common_user_docker_config_path }} by dropping Docker Desktop-only keys, remove Docker Desktop
      user state, and continue with Docker Engine installation.
  when:
    - common_enable_docker
    - common_has_docker_desktop
    - not (docker_desktop_cleanup_approved | bool)
  tags:
    - packages
    - system

- name: Remove Docker Desktop after explicit replacement approval
  ansible.builtin.apt:
    name: docker-desktop
    state: absent
    purge: true
    autoremove: true
  when:
    - common_enable_docker
    - common_has_docker_desktop
    - docker_desktop_cleanup_approved | bool
  tags:
    - packages
    - system

- name: Uninstall conflicting Docker packages (docker.io / containerd / runc)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true
    autoremove: true
  when: common_enable_docker
  tags:
    - packages
    - system

- name: Remove native Thunderbird package after migrating to Flatpak
  ansible.builtin.apt:
    name: thunderbird
    state: absent
    purge: true
    autoremove: true
  when: common_enable_thunderbird
  tags:
    - packages
    - system
    - thunderbird

- name: Install baseline APT packages
  ansible.builtin.apt:
    name: >-
      {{
        apt_base_packages
        + common_apt_desktop_packages
        + common_secret_service_packages
        + ([ 'copyq', 'copyq-plugins' ] if common_install_copyq else [])
        + ([ 'libreoffice' ] if common_install_libreoffice else [])
        + ([ 'firefox' ] if common_enable_firefox else [])
        + ([ 'microsoft-edge-stable' ] if common_enable_edge else [])
        + ([
            'docker-ce',
            'docker-ce-cli',
            'containerd.io',
            'docker-buildx-plugin',
            'docker-compose-plugin'
          ] if common_enable_docker else [])
        + ([ 'flatpak' ] if common_flatpak_apps | length > 0 else [])
      }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not common_selective_feature_run
  tags:
    - packages
    - system

- name: Install selective APT feature packages
  ansible.builtin.apt:
    name: >-
      {{
        common_apt_desktop_packages
        + common_secret_service_packages
        + ([ 'copyq', 'copyq-plugins' ] if common_install_copyq else [])
        + ([ 'libreoffice' ] if common_install_libreoffice else [])
        + ([ 'firefox' ] if common_enable_firefox else [])
        + ([ 'microsoft-edge-stable' ] if common_enable_edge else [])
        + ([
            'docker-ce',
            'docker-ce-cli',
            'containerd.io',
            'docker-buildx-plugin',
            'docker-compose-plugin'
          ] if common_enable_docker else [])
        + ([ 'flatpak' ] if common_flatpak_apps | length > 0 else [])
      }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - common_selective_feature_run
    - >-
      common_apt_desktop_packages | length > 0
      or common_secret_service_packages | length > 0
      or common_install_copyq
      or common_install_libreoffice
      or common_enable_firefox
      or common_enable_edge
      or common_enable_docker
      or common_flatpak_apps | length > 0
  tags:
    - packages
    - system

- name: Install OpenVPN workstation packages
  ansible.builtin.apt:
    name: "{{ common_openvpn_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: common_enable_openvpn and common_openvpn_packages | length > 0
  tags:
    - openvpn
    - packages
    - system

- name: Ensure Git Credential Manager native packages are available for this architecture
  ansible.builtin.assert:
    that:
      - common_gcm_release_arch | length > 0
      - common_gcm_deb_url | length > 0
      - common_gcm_deb_checksum | length > 0
    fail_msg: Git Credential Manager publishes Debian packages only for amd64 and arm64.
  when: common_enable_git_credential_oauth
  tags:
    - packages
    - system
    - git

- name: Remove git-credential-oauth after migrating to Git Credential Manager
  ansible.builtin.apt:
    name: git-credential-oauth
    state: absent
    purge: true
    autoremove: true
  when: common_enable_git_credential_oauth
  tags:
    - packages
    - system
    - git

- name: Install and configure Git Credential Manager
  when: common_enable_git_credential_oauth
  tags:
    - packages
    - system
    - git
  block:
    - name: Download the pinned Git Credential Manager Debian package
      ansible.builtin.get_url:
        url: "{{ common_gcm_deb_url }}"
        dest: "/tmp/{{ common_gcm_package_filename }}"
        mode: "0644"
        force: false
        checksum: "{{ common_gcm_deb_checksum if common_gcm_deb_checksum | length > 0 else omit }}"

    - name: Install Git Credential Manager from the pinned upstream Debian package
      ansible.builtin.apt:
        deb: "/tmp/{{ common_gcm_package_filename }}"
        state: present
        update_cache: true

    - name: Remove the legacy git-credential-oauth managed Git config block
      ansible.builtin.blockinfile:
        path: "{{ local_home }}/.gitconfig"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: git-credential-oauth"
        state: absent
        create: true
        mode: "0644"
      become: true
      become_user: "{{ local_user }}"

    - name: Restart gnome-keyring-daemon to ensure clean D-Bus secret service session
      when:
        - lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') | length > 0
        - common_enable_secret_service
      block:
        - name: Restart gnome-keyring-daemon
          ansible.builtin.shell:
            cmd: >-
              gnome-keyring-daemon -r -d
            executable: /bin/bash
          register: system_keyring_restart
          changed_when: system_keyring_restart.stdout | length > 0
          become: true
          become_user: "{{ local_user }}"
          environment:
            DBUS_SESSION_BUS_ADDRESS: "{{ lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') }}"
            DISPLAY: "{{ lookup('ansible.builtin.env', 'DISPLAY') }}"
            XDG_RUNTIME_DIR: "{{ lookup('ansible.builtin.env', 'XDG_RUNTIME_DIR') }}"
      rescue:
        - name: Warn when gnome-keyring-daemon restart fails
          ansible.builtin.debug:
            msg: >-
              WARNING: Could not restart gnome-keyring-daemon.
              Details: {{ ansible_failed_result.msg | default('no error message provided') }}
          changed_when: false

    - name: Configure Git Credential Manager as the global Git credential helper
      ansible.builtin.blockinfile:
        path: "{{ local_home }}/.gitconfig"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: git-credential-manager"
        block: |
          [credential]
            helper =
            helper = /usr/local/bin/git-credential-manager
            credentialStore = secretservice
        create: true
        mode: "0644"
      become: true
      become_user: "{{ local_user }}"
  rescue:
    - name: Warn when Git Credential Manager install/configuration fails
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not finish installing/configuring Git Credential Manager
          (download, install, or config step failed). Bootstrap will continue without
          failing this optional feature. Failed step: {{ ansible_failed_task.name }}.
          Details: {{ ansible_failed_result.msg | default('no error message provided') }}
      changed_when: false

- name: Report when clipboard-history auto mode defers to an existing clipboard manager
  ansible.builtin.debug:
    msg: >-
      Skipping clipboard-history (Ringboard) because the system already has a clipboard manager installed:
      {{ common_installed_clipboard_managers | join(', ') }}.
  when:
    - common_feature_mode_clipboard_history == 'auto'
    - not common_install_clipboard_history
  changed_when: false
  tags:
    - packages
    - system

- name: Report when LibreOffice auto mode defers to an existing office suite
  ansible.builtin.debug:
    msg: >-
      Skipping LibreOffice because the system already has an office suite installed:
      {{ common_installed_office_suites | join(', ') }}.
  when:
    - common_feature_mode_office_suite == 'auto'
    - not common_install_libreoffice
  changed_when: false
  tags:
    - packages
    - system

- name: Ensure the login shell is Zsh for the target user
  ansible.builtin.user:
    name: "{{ local_user }}"
    shell: /usr/bin/zsh
  when: not common_selective_feature_run
  tags:
    - shell
    - system

# Clipboard-history (Ringboard) install and setup
- name: Include clipboard-history setup tasks
  ansible.builtin.import_tasks: clipboard_history.yml
  when: common_install_clipboard_history
  tags:
    - clipboard-history

# Pop!_OS system monitor shortcut setup
- name: Include GNOME System Monitor shortcut tasks
  ansible.builtin.import_tasks: gnome_system_monitor.yml
  when: common_is_pop_desktop_host
  tags:
    - system

# CopyQ legacy config setup (Win+V shortcut)
- name: Include CopyQ config tasks
  ansible.builtin.import_tasks: copyq.yml
  when: common_install_copyq
  tags:
    - copyq
