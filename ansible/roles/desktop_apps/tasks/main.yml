---
- name: Install VS Code and Brave from official repositories
  ansible.builtin.apt:
    name: >-
      {{
        ([ 'code' ] if common_enable_vscode else [])
        + ([ 'brave-browser' ] if common_enable_brave else [])
      }}
    state: present
  when: common_enable_vscode or common_enable_brave
  tags:
    - applications
    - vscode
    - brave

- name: Install Warp Terminal from its official repository
  ansible.builtin.apt:
    name: warp-terminal
    state: present
    update_cache: true
  when: common_enable_warp_terminal
  tags:
    - applications
    - warp-terminal

- name: Ensure the VS Code runtime arguments directory exists
  ansible.builtin.file:
    path: "{{ local_home }}/.vscode"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ local_user }}"
  when:
    - common_enable_vscode
    - ansible_facts['distribution'] in ['Pop!_OS', 'Ubuntu']
  tags:
    - applications
    - vscode

- name: Check whether VS Code runtime arguments file exists
  ansible.builtin.stat:
    path: "{{ local_home }}/.vscode/argv.json"
  register: desktop_apps_vscode_argv_stat
  when:
    - common_enable_vscode
    - ansible_facts['distribution'] in ['Pop!_OS', 'Ubuntu']
  tags:
    - applications
    - vscode

- name: Load current VS Code runtime arguments
  when:
    - common_enable_vscode
    - ansible_facts['distribution'] in ['Pop!_OS', 'Ubuntu']
    - desktop_apps_vscode_argv_stat.stat.exists
  tags:
    - applications
    - vscode
  block:
    - name: Read current VS Code runtime arguments
      ansible.builtin.slurp:
        path: "{{ local_home }}/.vscode/argv.json"
      register: desktop_apps_vscode_argv_slurp

    - name: Store current VS Code runtime arguments content
      ansible.builtin.set_fact:
        desktop_apps_vscode_argv_existing_content: "{{ desktop_apps_vscode_argv_slurp.content | b64decode }}"

    - name: Detect existing VS Code password-store runtime argument
      ansible.builtin.set_fact:
        desktop_apps_vscode_argv_has_password_store: >-
          {{ desktop_apps_vscode_argv_existing_content is search('(?m)^\s*"password-store"\s*:') }}
  rescue:
    - name: Ignore unreadable VS Code runtime arguments content and reset
      ansible.builtin.set_fact:
        desktop_apps_vscode_argv_existing_content: ""
        desktop_apps_vscode_argv_has_password_store: false

- name: Update existing VS Code password-store runtime argument
  ansible.builtin.replace:
    path: "{{ local_home }}/.vscode/argv.json"
    regexp: '(?m)^(\s*"password-store"\s*:\s*")[^"]*("\s*,?\s*)$'
    replace: "\\1gnome-libsecret\\2"
  become: true
  become_user: "{{ local_user }}"
  when:
    - common_enable_vscode
    - ansible_facts['distribution'] in ['Pop!_OS', 'Ubuntu']
    - desktop_apps_vscode_argv_stat.stat.exists
    - desktop_apps_vscode_argv_has_password_store | default(false)
  tags:
    - applications
    - vscode

- name: Add missing VS Code password-store runtime argument
  ansible.builtin.replace:
    path: "{{ local_home }}/.vscode/argv.json"
    regexp: '(?m)^(\s*"[^"]+"\s*:\s*.+)(\n\s*})$'
    replace: '\1,\n\t"password-store": "gnome-libsecret"\2'
  become: true
  become_user: "{{ local_user }}"
  when:
    - common_enable_vscode
    - ansible_facts['distribution'] in ['Pop!_OS', 'Ubuntu']
    - desktop_apps_vscode_argv_stat.stat.exists
    - not (desktop_apps_vscode_argv_has_password_store | default(false))
  tags:
    - applications
    - vscode

- name: Create VS Code runtime arguments file when missing
  ansible.builtin.copy:
    dest: "{{ local_home }}/.vscode/argv.json"
    content: |
      {
        "password-store": "gnome-libsecret"
      }
    mode: "0644"
  become: true
  become_user: "{{ local_user }}"
  when:
    - common_enable_vscode
    - ansible_facts['distribution'] in ['Pop!_OS', 'Ubuntu']
    - not desktop_apps_vscode_argv_stat.stat.exists
  tags:
    - applications
    - vscode

- name: Ensure RustDesk native packages are available for this architecture
  ansible.builtin.assert:
    that:
      - common_deb_arch in rustdesk_release_arch_map
    fail_msg: RustDesk publishes native Debian packages only for amd64 and arm64.
  tags:
    - applications
    - rustdesk

- name: Check whether RustDesk is still installed as a system Flatpak
  ansible.builtin.command:
    cmd: flatpak info --system com.rustdesk.RustDesk
  register: desktop_apps_rustdesk_flatpak_info
  changed_when: false
  failed_when: false
  when: "'flatpak' in ansible_facts.packages"
  tags:
    - applications
    - rustdesk

- name: Remove the system RustDesk Flatpak before installing the native package
  ansible.builtin.command:
    cmd: flatpak uninstall --system --noninteractive com.rustdesk.RustDesk
  changed_when: desktop_apps_rustdesk_flatpak_info.rc == 0
  when:
    - "'flatpak' in ansible_facts.packages"
    - desktop_apps_rustdesk_flatpak_info.rc == 0
  tags:
    - applications
    - rustdesk

- name: Download the pinned RustDesk Debian package
  tags:
    - applications
    - rustdesk
  block:
    - name: Fetch the pinned RustDesk Debian package
      ansible.builtin.get_url:
        url: >-
          https://github.com/rustdesk/rustdesk/releases/download/{{ rustdesk_version
          }}/{{ rustdesk_package_filename }}
        dest: /tmp/{{ rustdesk_package_filename }}
        mode: "0644"
        force: false
      vars:
        rustdesk_package_filename: >-
          rustdesk-{{ rustdesk_version }}-{{ rustdesk_release_arch_map[common_deb_arch] }}.deb
  rescue:
    - name: Warn when RustDesk package download fails
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not download the RustDesk Debian package.
          Bootstrap will continue without failing this optional feature.
          Details: {{ ansible_failed_result.msg | default('no error message provided') }}
      changed_when: false

- name: Install RustDesk and start its system service
  tags:
    - applications
    - rustdesk
  block:
    - name: Install RustDesk from the pinned upstream Debian package
      ansible.builtin.apt:
        deb: /tmp/{{ rustdesk_package_filename }}
        state: present
        update_cache: true
      vars:
        rustdesk_package_filename: >-
          rustdesk-{{ rustdesk_version }}-{{ rustdesk_release_arch_map[common_deb_arch] }}.deb

    - name: Ensure the RustDesk system service is enabled and started
      ansible.builtin.systemd:
        name: rustdesk
        enabled: true
        state: started
        daemon_reload: true
  rescue:
    - name: Warn when RustDesk install/service startup fails
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not finish installing RustDesk or starting its service.
          Bootstrap will continue without failing this optional feature.
          Failed step: {{ ansible_failed_task.name }}.
          Details: {{ ansible_failed_result.msg | default('no error message provided') }}
      changed_when: false
