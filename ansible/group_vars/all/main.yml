---
local_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
local_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
dotfiles_repo: "{{ local_home }}/my-workstation"
supported_distributions:
  - Ubuntu
  - Pop!_OS
# Use an absolute, playbook-relative wrapper path. Ansible invokes become
# commands from a temporary module directory, so a relative become_exe in
# ansible.cfg cannot reliably find the repository script.
ansible_become_exe: "{{ playbook_dir }}/../scripts/ansible-become-sudo"
deb_arch_map:
  x86_64: amd64
  amd64: amd64
  aarch64: arm64
  arm64: arm64
  armv7l: armhf
  armhf: armhf
nix_system_map:
  x86_64: x86_64-linux
  amd64: x86_64-linux
  aarch64: aarch64-linux
  arm64: aarch64-linux
# Baseline defaults. Local overrides can define only the keys they need in override.yml.
feature_flags_defaults:
  desktop_tools: auto
  clipboard_history: auto
  copyq: disabled
  office_suite: auto
  vscode: enabled
  brave: enabled
  git_credential_oauth: enabled
  thunderbird: disabled
  firefox: disabled
  edge: disabled
  docker: enabled
  virt_manager: disabled
  nix: enabled
  swap: enabled
  openvpn: auto
  rustup: enabled
  ai_tools: enabled
  gem_team: disabled
  file_manager_integration: auto
  dev_tools: enabled
  warp_terminal: enabled
  shell_config: enabled
clipboard_manager_package_candidates:
  - clip-win
  - ringboard-server
  - ringboard-iced
  - ringboard
  - copyq
  - cliphist
  - clipman
  - clipboard-manager
  - cosmic-clipboard-manager
  - cosmic-ext-applet-clipboard-manager
  - diodon
  - gpaste
  - greenclip
  - klipper
  - parcellite
  - clipit
  - qlipper
  - xfce4-clipman
  - xfce4-clipman-plugin
gnome_desktop_package_candidates:
  - gnome-shell
  - gnome-session
  - gnome-session-bin
  - ubuntu-desktop
  - ubuntu-desktop-minimal
  - pop-desktop
gnome_secret_service_packages:
  - gnome-keyring
office_suite_package_candidates:
  - libreoffice
  - libreoffice-core
  - onlyoffice-desktopeditors
  - calligra
  - abiword
  - gnumeric
# Set to a pinned version or "latest" to resolve release URL and SHA-256 from GitHub metadata.
gcm_version: "latest"
gcm_release_arch_map:
  amd64: x64
  arm64: arm64
apt_base_packages:
  - ca-certificates
  - curl
  - desktop-file-utils
  - direnv
  - git
  - gnupg
  - ripgrep
  - software-properties-common
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
distro_desktop_packages:
  Ubuntu:
    - gnome-tweaks
    - remmina
    - remmina-plugin-rdp
    - remmina-plugin-secret
  Pop!_OS:
    - gnome-tweaks
    - remmina
    - remmina-plugin-rdp
    - remmina-plugin-secret
distro_flatpak_apps:
  Ubuntu:
    - org.gimp.GIMP
    - com.bitwarden.desktop
    - com.discordapp.Discord
    - com.spotify.Client
    - com.valvesoftware.Steam
    - org.videolan.VLC
  Pop!_OS:
    - org.gimp.GIMP
    - com.bitwarden.desktop
    - com.discordapp.Discord
    - com.spotify.Client
    - com.valvesoftware.Steam
    - org.videolan.VLC
# Set to a pinned version or "latest" to resolve release URL and SHA-256 from GitHub metadata.
rustdesk_version: "latest"
# Branch/tag of axellpadilla/clipboard-history to install from.
clipboard_history_branch: "patched"
rustdesk_release_arch_map:
  amd64: x86_64
  arm64: aarch64
virt_manager_packages:
  - qemu-kvm
  - libvirt-daemon-system
  - libvirt-clients
  - bridge-utils
  - virtinst
  - virt-manager
openvpn_core_packages:
  - openvpn
openvpn_network_manager_packages:
  - network-manager-openvpn
virt_manager_default_uri: qemu:///system
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"
    mode: "non-blocking"
    max-buffer-size: "4m"
  builder:
    gc:
      enabled: true
      defaultKeepStorage: 20GB
# Use Docker's modern containerd image store by default. `docker info` reports
# this as the "overlayfs" storage driver. Existing overlay2 installations are
# migrated by the guarded image-store role; their old data is retained unless
# docker_prune_old_image_store is explicitly enabled. Set to "overlay2" only
# when a host needs the classic store or to roll back.
docker_image_store: containerd
# Seconds that "docker stop" waits for each running container before SIGKILL
# when the image store switch stops the workloads. The 10s Docker default can
# cut a stateful service (for example MongoDB/WiredTiger) checkpoint short, so
# this is generous on purpose.
docker_image_store_stop_timeout: 60
# Irreversible: delete the leftover overlay2 data once the containerd image
# store is active. It is only honoured with docker_image_store: containerd and
# when no overlay2 layers are still mounted.
docker_prune_old_image_store: false
docker_desktop_cleanup_approved: false
vscode_file_manager_integration: auto
# Existing swap files are managed only when a root-owned
# <path>.my-workstation-managed marker exists. The role creates markers for new
# swap files; pre-existing files are left untouched unless explicitly adopted.
swap_file_path: /swapfile
swap_priority: 500
nix_install_mode: single-user
nix_home_manager_profile_name: my-workstation-home-manager
nix_cleanup_generation_max_age_days: 30
nodesource_major_version: "24"
warp_terminal_apt_key_url: https://releases.warp.dev/linux/keys/warp.asc
# Brave currently publishes three primary keys for signing-key rotation.
# Unknown new primary keys are rejected until this allowlist is reviewed.
brave_apt_key_fingerprints:
  - DBF1A116C220B8C7164F98230686B78420038257
  - 47D32A74E9A9E013A4B4926C68D513D36A73CD96
  - B2A3DCA350E67256740DF904DE4EC67BE4B0DCA0
oh_my_zsh_theme: robbyrussell
oh_my_zsh_plugins:
  - git
dotfiles_editor_command: "{{ lookup('ansible.builtin.env', 'DOTFILES_EDITOR') | default('code --wait', true) }}"
workstation_cleanup_downloads_max_age_days: 90
workstation_cleanup_bun_cache_max_age_days: 30
workstation_cleanup_cargo_target_max_age_days: 14
workstation_cleanup_go_build_max_age_days: 14
workstation_cleanup_go_mod_max_age_days: 30
# Docker cleanup: containers are pruned by how long they have been STOPPED
# (State.FinishedAt), not by when they were created. Images, networks and build
# cache are pruned by creation age. Keep these windows generous: a short cutoff
# deletes idle devcontainer images and their build cache, which forces a full
# rebuild (and re-download of every layer) the next time the project is opened.
workstation_cleanup_docker_container_max_age_days: 30
workstation_cleanup_docker_image_max_age_days: 30
workstation_cleanup_docker_network_max_age_days: 30
workstation_cleanup_docker_build_cache_max_age_days: 30
