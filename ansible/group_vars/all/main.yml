---
local_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
local_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
dotfiles_repo: "{{ local_home }}/my-workstation"
supported_distributions:
  - Ubuntu
  - Pop!_OS
deb_arch_map:
  x86_64: amd64
  amd64: amd64
  aarch64: arm64
  arm64: arm64
  armv7l: armhf
  armhf: armhf
nix_system_map:
  x86_64: x86_64-linux
  amd64: x86_64-linux
  # aarch64: aarch64-linux
  arm64: aarch64-linux
# Baseline defaults. Local overrides can define only the keys they need in override.yml.
feature_flags_defaults:
  desktop_tools: auto
  clip_win: auto
  copyq: disabled
  office_suite: auto
  vscode: enabled
  brave: enabled
  git_credential_oauth: enabled
  thunderbird: disabled
  firefox: disabled
  edge: disabled
  docker: enabled
  virt_manager: disabled
  nix: enabled
  openvpn: auto
  file_manager_integration: auto
clipboard_manager_package_candidates:
  - clip-win
  - copyq
  - cliphist
  - clipman
  - clipboard-manager
  - cosmic-clipboard-manager
  - cosmic-ext-applet-clipboard-manager
  - diodon
  - gpaste
  - greenclip
  - klipper
  - parcellite
  - clipit
  - qlipper
  - xfce4-clipman
  - xfce4-clipman-plugin
gnome_desktop_package_candidates:
  - gnome-shell
  - gnome-session
  - gnome-session-bin
  - ubuntu-desktop
  - ubuntu-desktop-minimal
  - pop-desktop
gnome_secret_service_packages:
  - gnome-keyring
office_suite_package_candidates:
  - libreoffice
  - libreoffice-core
  - onlyoffice-desktopeditors
  - calligra
  - abiword
  - gnumeric
# Set to a pinned version (recommended) or "latest" to resolve from GitHub at runtime.
gcm_version: "2.7.3"
gcm_release_arch_map:
  amd64: x64
  arm64: arm64
gcm_release_deb_checksums:
  amd64: "sha256:a5431e1b6f25aa8b424e747d880f86e74c739ad52e72c924a7b1a25d87ac7e72"
  arm64: "sha256:f5995901ef3a2ffc4442e4a9a92c8dfdc8f1df1affe8ef1d037b7ad3302b923b"
apt_base_packages:
  - ca-certificates
  - curl
  - desktop-file-utils
  - git
  - gnupg
  - ripgrep
  - software-properties-common
  - zsh
distro_desktop_packages:
  Ubuntu:
    - gnome-tweaks
  Pop!_OS:
    - gnome-tweaks
distro_flatpak_apps:
  Ubuntu:
    - org.gimp.GIMP
    - com.bitwarden.desktop
    - com.discordapp.Discord
    - com.spotify.Client
    - com.valvesoftware.Steam
    - org.videolan.VLC
  Pop!_OS:
    - org.gimp.GIMP
    - com.bitwarden.desktop
    - com.discordapp.Discord
    - com.spotify.Client
    - com.valvesoftware.Steam
    - org.videolan.VLC
rustdesk_version: "1.4.6"
clip_win_version: "0.6.5-patched.2"
clip_win_release_deb_checksums:
  amd64: "sha256:63a7824ad84b3fe6c8a6328982c72a703f177ec768ccd474ebdbc762bc7b20fd"
  arm64: "sha256:92f5e8395849e7e8c55e582fca35bf777d54426e25ec441382a98ffa8a913170"
rustdesk_release_arch_map:
  amd64: x86_64
  arm64: aarch64
virt_manager_packages:
  - qemu-kvm
  - libvirt-daemon-system
  - libvirt-clients
  - bridge-utils
  - virtinst
  - virt-manager
openvpn_core_packages:
  - openvpn
openvpn_network_manager_packages:
  - network-manager-openvpn
virt_manager_default_uri: qemu:///system
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"
    mode: "non-blocking"
    max-buffer-size: "4m"
docker_desktop_cleanup_approved: false
vscode_file_manager_integration: auto
nix_install_mode: single-user
nix_home_manager_profile_name: my-workstation-home-manager
nix_cleanup_generation_max_age_days: 30
